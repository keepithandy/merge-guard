name: Node LTS compatibility

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18.x', '20.x', '22.x', '24.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package.json

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies without changing lock state
        run: npm install --no-package-lock --ignore-scripts

      - name: Run smoke suite
        run: npm run smoke

      - name: Run CLI contract suite
        run: npm run test:cli

      - name: Run report contract snapshots
        run: npm run test:snapshots

      - name: Run repository-intelligence contracts and snapshots
        run: npm run test:repository

      - name: Run policy-pack contracts
        run: npm run test:policies

      - name: Run protected-path and CODEOWNERS guidance contracts
        run: npm run test:guidance

      - name: Run policy inheritance and exception contracts
        run: npm run test:policy-resolution

      - name: Run pull-request summary contracts
        run: npm run test:pr-summary

      - name: Run release-readiness suite
        run: npm run release:check

      - name: Check CLI help
        run: node src/cli.js --help

      - name: Analyze sample diff
        run: node src/cli.js examples/sample.diff

      - name: Generate JSON report
        run: node src/cli.js --json examples/sample.diff

      - name: Verify package contents without publishing
        run: npm pack --dry-run
