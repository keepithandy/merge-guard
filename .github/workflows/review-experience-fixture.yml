name: Review experience fixture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-experience:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies without changing lock state
        run: npm install --no-package-lock --ignore-scripts

      - name: Run offline end-to-end fixture contracts
        run: npm run test:review-e2e

      - name: Run first-push report mode
        id: first_push
        uses: ./
        with:
          preset: standard
          comment: "false"
          annotations: "true"
          sarif: "true"
          impact-metadata: test/fixtures/impact-metadata/valid.json
          fail-threshold: "99"
          diff-path: test/fixtures/review-e2e/push-1.diff

      - name: Preserve first-push report
        shell: bash
        env:
          REPORT_PATH: ${{ steps.first_push.outputs.report-path }}
        run: |
          test -s "$REPORT_PATH"
          cp "$REPORT_PATH" review-fixture-push-1.json

      - name: Run second-push comment mode without GitHub writes
        id: second_push
        uses: ./
        with:
          preset: standard
          comment: "true"
          comment-dry-run: "true"
          annotations: "true"
          sarif: "true"
          impact-metadata: test/fixtures/impact-metadata/valid.json
          compare: "true"
          previous-report: review-fixture-push-1.json
          fail-threshold: "99"
          diff-path: test/fixtures/review-e2e/push-2.diff

      - name: Assert second-push review outputs
        shell: bash
        env:
          REPORT_PATH: ${{ steps.second_push.outputs.report-path }}
          ANNOTATIONS_PATH: ${{ steps.second_push.outputs.annotations-path }}
          SARIF_PATH: ${{ steps.second_push.outputs.sarif-path }}
          COMPARISON_PATH: ${{ steps.second_push.outputs.comparison-path }}
          COMPARISON_STATUS: ${{ steps.second_push.outputs.comparison-status }}
        run: |
          test -s "$REPORT_PATH"
          test -s "$ANNOTATIONS_PATH"
          test -s "$SARIF_PATH"
          test -s "$COMPARISON_PATH"
          test "$COMPARISON_STATUS" = "compared"
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.REPORT_PATH)); const a=JSON.parse(fs.readFileSync(process.env.ANNOTATIONS_PATH)); const s=JSON.parse(fs.readFileSync(process.env.SARIF_PATH)); const c=JSON.parse(fs.readFileSync(process.env.COMPARISON_PATH)); if(r.repository.impactMetadata.status!=='valid' || a.annotations.length!==4 || s.runs[0].results.length!==4 || c.summary.new!==2 || c.summary.unchanged!==2 || c.summary.resolved!==2) process.exit(1)"

      - name: Run threshold failure contract
        id: threshold
        continue-on-error: true
        uses: ./
        with:
          preset: standard
          comment: "false"
          fail-threshold: "1"
          diff-path: test/fixtures/review-e2e/push-2.diff

      - name: Assert threshold failure was enforced
        if: ${{ steps.threshold.outcome != 'failure' }}
        run: |
          echo "Expected the second-push fixture to fail at threshold 1."
          exit 1
