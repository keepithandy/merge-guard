name: Composite Action fixture

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  action-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create known diff fixture
        shell: bash
        run: |
          mkdir -p action-fixture/src
          printf 'renderApp();\n' > action-fixture/src/app.js
          git diff --no-index /dev/null action-fixture/src/app.js > action-fixture/sample.diff || true

      - name: Run report-only Action
        uses: ./
        with:
          preset: standard
          comment: "false"
          diff-path: action-fixture/sample.diff

      - name: Run compact pull-request summary fixture
        shell: bash
        run: |
          node src/cli.js --pr-summary action-fixture/sample.diff > action-fixture/summary.md
          grep -q '<!-- merge-guard-pr-summary:v1 -->' action-fixture/summary.md
          grep -q '<summary>Files (' action-fixture/summary.md

      - name: Run Action with annotations and SARIF enabled
        id: native_review
        uses: ./
        with:
          preset: standard
          comment: "false"
          annotations: "true"
          sarif: "true"
          compare: "true"
          previous-report: test/fixtures/finding-comparison/previous.json
          diff-path: action-fixture/sample.diff

      - name: Assert native review outputs
        shell: bash
        env:
          REPORT_PATH: ${{ steps.native_review.outputs.report-path }}
          ANNOTATIONS_PATH: ${{ steps.native_review.outputs.annotations-path }}
          SARIF_PATH: ${{ steps.native_review.outputs.sarif-path }}
          COMPARISON_PATH: ${{ steps.native_review.outputs.comparison-path }}
          COMPARISON_STATUS: ${{ steps.native_review.outputs.comparison-status }}
        run: |
          test -s "$REPORT_PATH"
          test -s "$ANNOTATIONS_PATH"
          test -s "$SARIF_PATH"
          test -s "$COMPARISON_PATH"
          test "$COMPARISON_STATUS" = "compared"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.ANNOTATIONS_PATH)); const s=JSON.parse(fs.readFileSync(process.env.SARIF_PATH)); const c=JSON.parse(fs.readFileSync(process.env.COMPARISON_PATH)); if(a.schemaVersion!==1 || s.version!=='2.1.0' || c.status!=='compared') process.exit(1)"

      - name: Run Action with explicit starter policy
        uses: ./
        with:
          preset: standard
          policy: frontend
          comment: "false"
          diff-path: action-fixture/sample.diff

      - name: Run Action with explicit policy manifest
        uses: ./
        with:
          preset: standard
          policy-config: test/fixtures/policy-resolution/valid.json
          comment: "false"
          diff-path: action-fixture/sample.diff

      - name: Run threshold failure contract
        id: threshold
        continue-on-error: true
        uses: ./
        with:
          preset: standard
          comment: "false"
          fail-threshold: "1"
          diff-path: action-fixture/sample.diff

      - name: Assert threshold failure was enforced
        if: ${{ steps.threshold.outcome != 'failure' }}
        run: |
          echo "Expected merge-guard to fail at threshold 1."
          exit 1
