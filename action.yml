name: merge-guard

description: Run merge-guard against a pull request diff, enforce a risk threshold, and optionally comment on the PR.

author: keepithandy

branding:
  icon: shield
  color: blue

inputs:
  preset:
    description: "Risk preset to use: safe, standard, or strict."
    required: false
    default: standard
  comment:
    description: Post or update the merge-guard Markdown report on the pull request.
    required: false
    default: "false"
  comment-dry-run:
    description: Render comment mode without calling GitHub; intended for fixture and workflow validation.
    required: false
    default: "false"
  fail-threshold:
    description: Optional positive integer risk score that fails the action.
    required: false
    default: ""
  policy:
    description: "Optional starter policy: frontend, backend, library, browser-game, or infrastructure."
    required: false
    default: ""
  policy-config:
    description: Optional repository-relative path to an explicit root/package policy manifest.
    required: false
    default: ""
  impact-metadata:
    description: Optional repository-relative path to explicit checked-in repository impact metadata.
    required: false
    default: ""
  annotations:
    description: Emit deduplicated GitHub changed-line annotations for eligible findings.
    required: false
    default: "false"
  sarif:
    description: Generate merge-guard.sarif without uploading it.
    required: false
    default: "false"
  compare:
    description: Compare current findings with a previous immutable JSON report.
    required: false
    default: "false"
  previous-report:
    description: Optional path to the previous JSON report used when comparison is enabled.
    required: false
    default: ""
  previous-manifest:
    description: Optional artifact manifest bound to the previous JSON report.
    required: false
    default: ""
  expected-previous-repository:
    description: Optional repository identity asserted for strict prior-evidence verification.
    required: false
    default: ""
  expected-previous-branch:
    description: Optional branch identity asserted for strict prior-evidence verification.
    required: false
    default: ""
  expected-previous-commit:
    description: Optional commit identity asserted for strict prior-evidence verification.
    required: false
    default: ""
  diff-path:
    description: Optional path to a prebuilt diff file. When omitted, the action generates the pull request diff.
    required: false
    default: ""
  markdown:
    description: Print Markdown output instead of plain text. Comment mode always generates Markdown.
    required: false
    default: "true"

outputs:
  report-path:
    description: Path to the complete JSON report generated from the authoritative diff.
    value: ${{ steps.scan.outputs.report_path }}
  manifest-path:
    description: Path to the immutable artifact manifest bound to the JSON report.
    value: ${{ steps.evidence.outputs.manifest_path }}
  annotations-path:
    description: Path to the annotation bundle when annotations are enabled.
    value: ${{ steps.github_review.outputs.annotations_path }}
  sarif-path:
    description: Path to the SARIF file when SARIF generation is enabled.
    value: ${{ steps.github_review.outputs.sarif_path }}
  comparison-path:
    description: Path to the finding comparison JSON when comparison is enabled.
    value: ${{ steps.finding_comparison.outputs.comparison_path }}
  comparison-status:
    description: compared, history-unavailable, or report-unavailable.
    value: ${{ steps.finding_comparison.outputs.comparison_status }}
  prior-evidence-status:
    description: verified, missing, stale, cross-branch, incompatible, unverifiable, or empty for report-only comparison.
    value: ${{ steps.finding_comparison.outputs.prior_evidence_status }}
  projection-path:
    description: Path to the machine-readable review projection result.
    value: ${{ steps.review_projection.outputs.review_projection_path }}
  projection-status:
    description: complete, degraded, failed, or incomplete review projection status.
    value: ${{ steps.review_projection.outputs.review_projection_status }}

runs:
  using: composite
  steps:
    - name: Prepare pull request diff
      if: ${{ inputs.diff-path == '' }}
      shell: bash
      run: git diff "origin/${{ github.base_ref }}...HEAD" > merge-guard.diff

    - name: Prepare pull request context
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        MERGE_GUARD_PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        printf '%s' "$MERGE_GUARD_PR_BODY" > merge-guard-pr-body.md

    - name: Run merge-guard
      id: scan
      shell: bash
      env:
        MERGE_GUARD_DIFF_PATH: ${{ inputs.diff-path }}
        MERGE_GUARD_PRESET: ${{ inputs.preset }}
        MERGE_GUARD_FAIL_THRESHOLD: ${{ inputs.fail-threshold }}
        MERGE_GUARD_POLICY: ${{ inputs.policy }}
        MERGE_GUARD_POLICY_CONFIG: ${{ inputs.policy-config }}
        MERGE_GUARD_IMPACT_METADATA: ${{ inputs.impact-metadata }}
        MERGE_GUARD_MARKDOWN: ${{ inputs.markdown }}
        MERGE_GUARD_COMMENT: ${{ inputs.comment }}
        MERGE_GUARD_PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        diff_file="$MERGE_GUARD_DIFF_PATH"
        if [ -z "$diff_file" ]; then
          diff_file="merge-guard.diff"
        fi

        threshold_args=()
        if [ -n "$MERGE_GUARD_FAIL_THRESHOLD" ]; then
          threshold_args=(--fail-threshold "$MERGE_GUARD_FAIL_THRESHOLD")
        fi

        policy_args=()
        if [ -n "$MERGE_GUARD_POLICY" ] && [ -n "$MERGE_GUARD_POLICY_CONFIG" ]; then
          echo "policy and policy-config cannot be selected together."
          exit 1
        elif [ -n "$MERGE_GUARD_POLICY" ]; then
          policy_args=(--policy "$MERGE_GUARD_POLICY")
        elif [ -n "$MERGE_GUARD_POLICY_CONFIG" ]; then
          policy_args=(--policy-config "$MERGE_GUARD_POLICY_CONFIG")
        fi

        impact_metadata_args=()
        if [ -n "$MERGE_GUARD_IMPACT_METADATA" ]; then
          impact_metadata_args=(--impact-metadata "$MERGE_GUARD_IMPACT_METADATA")
        fi

        output_args=()
        if [ "$MERGE_GUARD_COMMENT" = "true" ]; then
          output_args=(--pr-summary)
        elif [ "$MERGE_GUARD_MARKDOWN" = "true" ]; then
          output_args=(--markdown)
        fi

        context_args=()
        if [ -n "$MERGE_GUARD_PR_TITLE" ]; then
          context_args+=(--pr-title "$MERGE_GUARD_PR_TITLE")
        fi
        if [ -s merge-guard-pr-body.md ]; then
          context_args+=(--pr-body merge-guard-pr-body.md)
        fi

        set +e
        node "$GITHUB_ACTION_PATH/src/cli.js" --ci --report-json merge-guard-report.json --preset "$MERGE_GUARD_PRESET" "${threshold_args[@]}" "${policy_args[@]}" "${impact_metadata_args[@]}" "${output_args[@]}" "${context_args[@]}" "$diff_file" | tee merge-guard-report.md
        scan_status=${PIPESTATUS[0]}
        set -e

        echo "exit_code=$scan_status" >> "$GITHUB_OUTPUT"
        echo "diff_path=$diff_file" >> "$GITHUB_OUTPUT"
        echo "report_path=merge-guard-report.json" >> "$GITHUB_OUTPUT"

    - name: Generate immutable report artifact manifest
      id: evidence
      shell: bash
      env:
        MERGE_GUARD_REPORT_PATH: ${{ steps.scan.outputs.report_path }}
        MERGE_GUARD_REPOSITORY: ${{ github.repository }}
        MERGE_GUARD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        MERGE_GUARD_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        manifest_path="merge-guard-report.manifest.json"
        if [ ! -s "$MERGE_GUARD_REPORT_PATH" ]; then
          echo "JSON report was not produced; artifact manifest is unavailable."
          echo "manifest_path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        manifest_args=(--report "$MERGE_GUARD_REPORT_PATH" --output "$manifest_path" --repository "$MERGE_GUARD_REPOSITORY" --commit "$MERGE_GUARD_COMMIT" --input-type diff)
        if [ -n "$MERGE_GUARD_BRANCH" ]; then
          manifest_args+=(--branch "$MERGE_GUARD_BRANCH")
        fi
        node "$GITHUB_ACTION_PATH/scripts/create-artifact-manifest.js" "${manifest_args[@]}"
        echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

    - name: Generate optional GitHub review outputs
      id: github_review
      if: ${{ inputs.annotations == 'true' || inputs.sarif == 'true' }}
      shell: bash
      env:
        MERGE_GUARD_ANNOTATIONS: ${{ inputs.annotations }}
        MERGE_GUARD_SARIF: ${{ inputs.sarif }}
        MERGE_GUARD_DIFF_PATH: ${{ steps.scan.outputs.diff_path }}
        MERGE_GUARD_REPORT_PATH: ${{ steps.scan.outputs.report_path }}
      run: |
        if [ ! -s "$MERGE_GUARD_REPORT_PATH" ]; then
          echo "JSON report was not produced; optional review projections are skipped."
          echo "annotations_path=" >> "$GITHUB_OUTPUT"
          echo "sarif_path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        review_args=(--report "$MERGE_GUARD_REPORT_PATH" --diff "$MERGE_GUARD_DIFF_PATH")
        annotations_path=""
        sarif_path=""

        if [ "$MERGE_GUARD_ANNOTATIONS" = "true" ]; then
          annotations_path="merge-guard-annotations.json"
          review_args+=(--annotations "$annotations_path" --emit-commands)
        fi
        if [ "$MERGE_GUARD_SARIF" = "true" ]; then
          sarif_path="merge-guard.sarif"
          review_args+=(--sarif "$sarif_path")
        fi

        node "$GITHUB_ACTION_PATH/scripts/github-review-outputs.js" "${review_args[@]}"
        echo "annotations_path=$annotations_path" >> "$GITHUB_OUTPUT"
        echo "sarif_path=$sarif_path" >> "$GITHUB_OUTPUT"

    - name: Compare findings with previous report
      id: finding_comparison
      if: ${{ inputs.compare == 'true' }}
      shell: bash
      env:
        MERGE_GUARD_CURRENT_REPORT: ${{ steps.scan.outputs.report_path }}
        MERGE_GUARD_PREVIOUS_REPORT: ${{ inputs.previous-report }}
        MERGE_GUARD_PREVIOUS_MANIFEST: ${{ inputs.previous-manifest }}
        MERGE_GUARD_EXPECTED_REPOSITORY: ${{ inputs.expected-previous-repository }}
        MERGE_GUARD_EXPECTED_BRANCH: ${{ inputs.expected-previous-branch }}
        MERGE_GUARD_EXPECTED_COMMIT: ${{ inputs.expected-previous-commit }}
      run: |
        comparison_path="merge-guard-comparison.json"
        comparison_markdown="merge-guard-comparison.md"
        if [ ! -s "$MERGE_GUARD_CURRENT_REPORT" ]; then
          echo "Current JSON report was not produced; comparison is unavailable."
          echo "comparison_path=" >> "$GITHUB_OUTPUT"
          echo "comparison_status=report-unavailable" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        comparison_args=(--current "$MERGE_GUARD_CURRENT_REPORT" --output "$comparison_path" --markdown)
        if [ -n "$MERGE_GUARD_PREVIOUS_REPORT" ]; then
          comparison_args+=(--previous "$MERGE_GUARD_PREVIOUS_REPORT")
        fi
        if [ -n "$MERGE_GUARD_PREVIOUS_MANIFEST" ]; then
          comparison_args+=(--previous-manifest "$MERGE_GUARD_PREVIOUS_MANIFEST")
        fi
        if [ -n "$MERGE_GUARD_EXPECTED_REPOSITORY" ]; then
          comparison_args+=(--expected-repository "$MERGE_GUARD_EXPECTED_REPOSITORY")
        fi
        if [ -n "$MERGE_GUARD_EXPECTED_BRANCH" ]; then
          comparison_args+=(--expected-branch "$MERGE_GUARD_EXPECTED_BRANCH")
        fi
        if [ -n "$MERGE_GUARD_EXPECTED_COMMIT" ]; then
          comparison_args+=(--expected-commit "$MERGE_GUARD_EXPECTED_COMMIT")
        fi

        set +e
        node "$GITHUB_ACTION_PATH/scripts/compare-reports.js" "${comparison_args[@]}" > "$comparison_markdown"
        comparison_exit=$?
        set -e

        if [ -s "$comparison_markdown" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$comparison_markdown" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -s "$comparison_markdown" ] && [ -f merge-guard-report.md ]; then
          printf '\n\n' >> merge-guard-report.md
          cat "$comparison_markdown" >> merge-guard-report.md
        fi
        if [ "$comparison_exit" -eq 2 ]; then
          echo "::warning title=Merge Guard comparison::Previous report history is unavailable; finding changes are unknown."
        elif [ "$comparison_exit" -ne 0 ]; then
          exit "$comparison_exit"
        fi

        echo "comparison_path=$comparison_path" >> "$GITHUB_OUTPUT"
        node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write('comparison_status='+value.status+'\n')" "$comparison_path" >> "$GITHUB_OUTPUT"
        node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write('prior_evidence_status='+(value.priorEvidence?.status || '')+'\n')" "$comparison_path" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      id: pr_comment
      if: ${{ inputs.comment == 'true' && (github.event_name == 'pull_request' || inputs.comment-dry-run == 'true') }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MERGE_GUARD_COMMENT_DRY_RUN: ${{ inputs.comment-dry-run }}
      run: |
        comment_args=(--report merge-guard-report.md)
        if [ "$MERGE_GUARD_COMMENT_DRY_RUN" = "true" ]; then
          comment_args+=(--dry-run)
        fi
        set +e
        node "$GITHUB_ACTION_PATH/scripts/pr-comment.js" "${comment_args[@]}"
        comment_exit=$?
        set -e
        if [ "$comment_exit" -ne 0 ]; then
          echo "::warning title=Merge Guard comment::Managed comment publication was unavailable; generated review evidence remains valid."
          echo "comment_status=unavailable" >> "$GITHUB_OUTPUT"
          echo "comment_result=" >> "$GITHUB_OUTPUT"
        elif [ "$MERGE_GUARD_COMMENT_DRY_RUN" = "true" ]; then
          echo "comment_status=produced" >> "$GITHUB_OUTPUT"
          echo "comment_result=previewed" >> "$GITHUB_OUTPUT"
        else
          echo "comment_status=produced" >> "$GITHUB_OUTPUT"
          echo "comment_result=published" >> "$GITHUB_OUTPUT"
        fi

    - name: Record review projection result
      id: review_projection
      if: ${{ always() }}
      shell: bash
      env:
        MERGE_GUARD_PROJECTION_PATH: merge-guard-review-projection.json
        MERGE_GUARD_ATTEMPT_OUTCOME: completed
        MERGE_GUARD_SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        MERGE_GUARD_REPORT_PATH: ${{ steps.scan.outputs.report_path }}
        MERGE_GUARD_MANIFEST_PATH: ${{ steps.evidence.outputs.manifest_path }}
        MERGE_GUARD_ANNOTATIONS_REQUESTED: ${{ inputs.annotations }}
        MERGE_GUARD_ANNOTATIONS_PATH: ${{ steps.github_review.outputs.annotations_path }}
        MERGE_GUARD_SARIF_REQUESTED: ${{ inputs.sarif }}
        MERGE_GUARD_SARIF_PATH: ${{ steps.github_review.outputs.sarif_path }}
        MERGE_GUARD_REVIEW_OUTCOME: ${{ steps.github_review.outcome }}
        MERGE_GUARD_COMPARISON_REQUESTED: ${{ inputs.compare }}
        MERGE_GUARD_COMPARISON_PATH: ${{ steps.finding_comparison.outputs.comparison_path }}
        MERGE_GUARD_COMPARISON_STATUS: ${{ steps.finding_comparison.outputs.comparison_status }}
        MERGE_GUARD_COMPARISON_OUTCOME: ${{ steps.finding_comparison.outcome }}
        MERGE_GUARD_COMMENT_REQUESTED: ${{ inputs.comment }}
        MERGE_GUARD_COMMENT_ELIGIBLE: ${{ github.event_name == 'pull_request' || inputs.comment-dry-run == 'true' }}
        MERGE_GUARD_COMMENT_STATUS: ${{ steps.pr_comment.outputs.comment_status }}
        MERGE_GUARD_COMMENT_RESULT: ${{ steps.pr_comment.outputs.comment_result }}
      run: node "$GITHUB_ACTION_PATH/scripts/create-review-projection.js" >> "$GITHUB_OUTPUT"

    - name: Enforce merge-guard result
      if: ${{ steps.scan.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "merge-guard exceeded its configured failure threshold."
        exit "${{ steps.scan.outputs.exit_code }}"
